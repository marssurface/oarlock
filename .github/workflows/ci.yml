name: CI

# Runs on every push and pull request. The project is self-contained, so the
# workflow assumes this directory is the repository root. If the repository
# root is a parent folder instead, move `.github/` up one level and set
# `defaults.run.working-directory: agent`.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · bench
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 24 runs the TypeScript sources directly (type stripping), which is
      # exactly how the CLI and the bench run locally.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        shell: bash
        run: |
          # Same command as `pnpm test`, but the failing test names are echoed as
          # annotations: they show up on the run page and in the public check-run
          # API, so a red CI is diagnosable without admin rights on the log.
          status=0
          node --test --test-reporter=spec test/*.test.ts > /tmp/unit-tests.log 2>&1 || status=$?
          cat /tmp/unit-tests.log
          if [ "$status" -ne 0 ]; then
            details=$(awk '/failing tests:/{flag=1} flag' /tmp/unit-tests.log | head -80)
            if [ -z "$details" ]; then
              details=$(grep -E "^(not ok|# fail|# tests|✖)" /tmp/unit-tests.log | head -80)
            fi
            printf '%s\n' "$details" | sed 's/%/%25/g' | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi
          exit "$status"

      - name: Build the distributable
        run: pnpm build

      - name: Bench — scripted runtime baseline
        run: pnpm bench

      - name: Bench — recorded model streams
        shell: bash
        run: |
          shopt -s nullglob
          files=(bench/transcripts/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::notice::no recorded transcripts yet — skipping replay"
            exit 0
          fi
          node bench/run.ts --replay
